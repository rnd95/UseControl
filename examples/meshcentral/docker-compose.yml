# MeshCentral on the OCI server, reachable only over the VPN (10.165.106.1).
# Update: change the tag below to the new release, then: docker compose pull && docker compose up -d
services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.3.1
    container_name: meshcentral
    restart: unless-stopped
    ports:
      - "10.165.106.1:4430:4430"   # web UI and agents, VPN address only
    environment:
      - DYNAMIC_CONFIG=false       # use data/config.json as it is
    volumes:
      - ./data:/opt/meshcentral/meshcentral-data
      - ./files:/opt/meshcentral/meshcentral-files
      - ./backups:/opt/meshcentral/meshcentral-backups
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
